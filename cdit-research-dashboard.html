<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CDIT Sales Intelligence Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3/lib/msal-browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel2: #1a2234;
      --border: #26314a;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #6366f1;
      --high: #ef4444;
      --med: #f59e0b;
      --low: #22c55e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 28px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 18px;
      margin: 0;
      font-weight: 600;
    }

    header .sub {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .status {
      font-size: 12px;
      color: var(--muted);
    }

    nav {
      display: flex;
      gap: 4px;
      padding: 0 28px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      overflow-x: auto;
    }

    nav button {
      background: none;
      border: none;
      color: var(--muted);
      padding: 12px 14px;
      font-size: 13px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
    }

    nav button.active {
      color: #fff;
      border-bottom-color: var(--accent);
    }

    main {
      padding: 24px 28px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .card {
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }

    .card .num {
      font-size: 26px;
      font-weight: 700;
    }

    .card .label {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th {
      text-align: left;
      color: var(--muted);
      font-weight: 600;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--panel);
      white-space: nowrap;
    }

    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    tr:hover td {
      background: #161f33;
    }

    .panel {
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: auto;
      max-height: 70vh;
    }

    .pill {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .pill.High {
      background: rgba(239, 68, 68, .15);
      color: var(--high);
    }

    .pill.Medium {
      background: rgba(245, 158, 11, .15);
      color: var(--med);
    }

    .pill.Low {
      background: rgba(34, 197, 94, .15);
      color: var(--low);
    }

    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    input[type=text] {
      background: var(--panel2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      min-width: 220px;
    }

    .empty {
      padding: 60px 20px;
      text-align: center;
      color: var(--muted);
    }

    .config-warning {
      background: #3f1d1d;
      border: 1px solid #7f1d1d;
      color: #fecaca;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
    }

    a {
      color: #a5b4fc;
    }

    .score {
      font-weight: 700;
    }
  </style>
</head>

<body>

  <header>
    <div>
      <h1>CDIT Sales Intelligence Dashboard</h1>
      <div class="sub" id="syncStatus">Not signed in yet</div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;">
      <button class="btn secondary" id="refreshBtn" disabled>Refresh</button>
      <button class="btn" id="signInBtn">Sign in with Microsoft</button>
    </div>
  </header>

  <nav id="tabs" style="display:none;">
    <button data-tab="overview" class="active">Overview</button>
    <button data-tab="brands">Brands</button>
    <button data-tab="news">News Feed</button>
    <button data-tab="opportunities">Opportunities</button>
    <button data-tab="contacts">Contacts</button>
    <button data-tab="pipeline">Pipeline</button>
    <button data-tab="emails">Email Drafts</button>
  </nav>

  <main>
    <div id="configWarning" class="config-warning" style="display:none;"></div>
    <div id="content">
      <div class="empty">Sign in with your Channelplay Microsoft account to load live data from the CDIT Lead Automation
        workbook on OneDrive.</div>
    </div>
  </main>

  <script>
    /* =========================================================================
       CONFIGURATION — fill these in once after the Azure app registration.
       See the setup instructions provided alongside this file.
    ========================================================================= */
    const CONFIG = {
      CLIENT_ID: "c6fa78d0-616e-4f5c-815f-796cfeee0261",
      TENANT_ID: "90872090-1f53-4d84-ad0a-cd78dce667a4", // or "common" if multi-tenant
      SHARE_URL: "https://teamchannelplay-my.sharepoint.com/:x:/g/personal/bikash_roy1_channelplay_in/IQBdRbNria4kQK9HocUWWValAUunv4LU8sdLx6CTA-0OO0A?e=RY9fMU",
    };

    let msalInstance = null;
    let workbookData = {}; // { SheetName: [ {col: val, ...}, ... ] }

    function showConfigWarning(msg) {
      const el = document.getElementById("configWarning");
      el.style.display = "block";
      el.textContent = msg;
    }

    function encodeShareUrl(url) {
      // Microsoft Graph "shares" API requires: "u!" + base64url(url), no padding.
      let b64 = btoa(unescape(encodeURIComponent(url)))
        .replace(/=+$/, "").replace(/\//g, "_").replace(/\+/g, "-");
      return "u!" + b64;
    }

    async function initMsal() {
      if (CONFIG.CLIENT_ID.startsWith("PASTE-")) {
        showConfigWarning("Configuration incomplete: open dashboard.html and fill in CLIENT_ID and TENANT_ID after completing the Azure app registration (see setup guide).");
        document.getElementById("signInBtn").disabled = true;
        return;
      }
      msalInstance = new msal.PublicClientApplication({
        auth: {
          clientId: CONFIG.CLIENT_ID,
          authority: `https://login.microsoftonline.com/${CONFIG.TENANT_ID}`,
          redirectUri: window.location.origin + window.location.pathname,
        },
        cache: { cacheLocation: "sessionStorage" }
      });
      await msalInstance.initialize();
      const accounts = msalInstance.getAllAccounts();
      if (accounts.length > 0) {
        msalInstance.setActiveAccount(accounts[0]);
        document.getElementById("signInBtn").textContent = "Signed in as " + accounts[0].username;
        document.getElementById("signInBtn").disabled = true;
        document.getElementById("refreshBtn").disabled = false;
        await loadWorkbook();
      }
    }

    async function signIn() {
      try {
        const result = await msalInstance.loginPopup({ scopes: ["Files.Read", "Files.Read.All"] });
        msalInstance.setActiveAccount(result.account);
        document.getElementById("signInBtn").textContent = "Signed in as " + result.account.username;
        document.getElementById("signInBtn").disabled = true;
        document.getElementById("refreshBtn").disabled = false;
        await loadWorkbook();
      } catch (e) {
        console.error(e);
        document.getElementById("syncStatus").textContent = "Sign-in failed: " + e.message;
      }
    }

    async function getToken() {
      const account = msalInstance.getActiveAccount();
      const req = { scopes: ["Files.Read", "Files.Read.All"], account };
      try {
        const res = await msalInstance.acquireTokenSilent(req);
        return res.accessToken;
      } catch (e) {
        const res = await msalInstance.acquireTokenPopup(req);
        return res.accessToken;
      }
    }

    async function loadWorkbook() {
      document.getElementById("syncStatus").textContent = "Loading latest data from OneDrive...";
      document.getElementById("tabs").style.display = "flex";
      try {
        const token = await getToken();
        const shareId = encodeShareUrl(CONFIG.SHARE_URL);
        const resp = await fetch(`https://graph.microsoft.com/v1.0/shares/${shareId}/driveItem/content`, {
          headers: { Authorization: "Bearer " + token }
        });
        if (!resp.ok) throw new Error("Graph API error " + resp.status + ": " + (await resp.text()));
        const buf = await resp.arrayBuffer();
        const wb = XLSX.read(buf, { type: "array", cellDates: true });
        workbookData = {};
        wb.SheetNames.forEach(name => {
          workbookData[name] = XLSX.utils.sheet_to_json(wb.Sheets[name], { defval: "" });
        });
        document.getElementById("syncStatus").textContent =
          "Live — last synced " + new Date().toLocaleString();
        renderTab(currentTab);
      } catch (e) {
        console.error(e);
        document.getElementById("syncStatus").textContent = "Sync failed: " + e.message;
      }
    }

    /* ---------------- Rendering ---------------- */
    let currentTab = "overview";

    function priorityLabel(score) {
      score = Number(score) || 0;
      if (score >= 4) return "High";
      if (score === 3) return "Medium";
      return "Low";
    }

    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function renderOverview() {
      const brands = workbookData["Brands Master"] || [];
      const opps = workbookData["Opportunities"] || [];
      const pipeline = workbookData["Pipeline"] || [];
      const high = opps.filter(o => Number(o["Priority Score (1-5)"]) >= 4).length;
      const dormant = opps.filter(o => Number(o["Priority Score (1-5)"]) <= 2).length;

      const pipelineByBrand = Object.fromEntries(pipeline.map(p => [p["Brand"], p["Stage"]]));
      const topOppByBrand = {};
      opps.forEach(o => {
        const b = o["Brand"];
        if (!topOppByBrand[b] || Number(o["Priority Score (1-5)"]) > Number(topOppByBrand[b]["Priority Score (1-5)"])) {
          topOppByBrand[b] = o;
        }
      });

      const rows = brands.map(b => {
        const top = topOppByBrand[b["Brand"]];
        return `<tr>
      <td><strong>${escapeHtml(b["Brand"])}</strong></td>
      <td><span class="pill ${escapeHtml(b["Priority Tier"])}">${escapeHtml(b["Priority Tier"])}</span></td>
      <td>${escapeHtml(top ? top["Opportunity Type"] : "-")}</td>
      <td class="score">${top ? escapeHtml(top["Priority Score (1-5)"]) : "-"}</td>
      <td>${escapeHtml(pipelineByBrand[b["Brand"]] || "-")}</td>
    </tr>`;
      }).join("");

      document.getElementById("content").innerHTML = `
    <div class="cards">
      <div class="card"><div class="num">${brands.length}</div><div class="label">Brands Tracked</div></div>
      <div class="card"><div class="num">${opps.length}</div><div class="label">Open Opportunities</div></div>
      <div class="card"><div class="num" style="color:var(--high)">${high}</div><div class="label">High Priority (4-5)</div></div>
      <div class="card"><div class="num" style="color:var(--low)">${dormant}</div><div class="label">Dormant / Low Priority</div></div>
    </div>
    <div class="panel">
      <table>
        <thead><tr><th>Brand</th><th>Priority Tier</th><th>Top Opportunity</th><th>Score</th><th>Pipeline Stage</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
    }

    function genericTable(sheetName, columns) {
      const rows = workbookData[sheetName] || [];
      const cols = columns || (rows[0] ? Object.keys(rows[0]) : []);
      const thead = `<tr>${cols.map(c => `<th>${escapeHtml(c)}</th>`).join("")}</tr>`;
      const tbody = rows.map(r => `<tr>${cols.map(c => `<td>${escapeHtml(r[c])}</td>`).join("")}</tr>`).join("");
      document.getElementById("content").innerHTML = `
    <div class="toolbar"><input type="text" id="searchBox" placeholder="Search ${escapeHtml(sheetName)}..."></div>
    <div class="panel"><table id="dataTable"><thead>${thead}</thead><tbody>${tbody}</tbody></table></div>`;
      document.getElementById("searchBox").addEventListener("input", (e) => {
        const q = e.target.value.toLowerCase();
        document.querySelectorAll("#dataTable tbody tr").forEach(tr => {
          tr.style.display = tr.textContent.toLowerCase().includes(q) ? "" : "none";
        });
      });
    }

    function renderOpportunities() {
      const rows = workbookData["Opportunities"] || [];
      const cols = rows[0] ? Object.keys(rows[0]) : [];
      const thead = `<tr>${cols.map(c => `<th>${escapeHtml(c)}</th>`).join("")}</tr>`;
      const tbody = rows
        .slice()
        .sort((a, b) => Number(b["Priority Score (1-5)"]) - Number(a["Priority Score (1-5)"]))
        .map(r => {
          const label = priorityLabel(r["Priority Score (1-5)"]);
          return `<tr>${cols.map(c => {
            if (c === "Priority Score (1-5)") return `<td><span class="pill ${label}">${escapeHtml(r[c])} · ${label}</span></td>`;
            return `<td>${escapeHtml(r[c])}</td>`;
          }).join("")}</tr>`;
        }).join("");
      document.getElementById("content").innerHTML = `
    <div class="toolbar"><input type="text" id="searchBox" placeholder="Search opportunities..."></div>
    <div class="panel"><table id="dataTable"><thead>${thead}</thead><tbody>${tbody}</tbody></table></div>`;
      document.getElementById("searchBox").addEventListener("input", (e) => {
        const q = e.target.value.toLowerCase();
        document.querySelectorAll("#dataTable tbody tr").forEach(tr => {
          tr.style.display = tr.textContent.toLowerCase().includes(q) ? "" : "none";
        });
      });
    }

    function renderTab(tab) {
      currentTab = tab;
      if (!workbookData["Brands Master"]) {
        document.getElementById("content").innerHTML = `<div class="empty">No data loaded yet. Sign in above.</div>`;
        return;
      }
      if (tab === "overview") return renderOverview();
      if (tab === "brands") return genericTable("Brands Master");
      if (tab === "news") return genericTable("News feed");
      if (tab === "opportunities") return renderOpportunities();
      if (tab === "contacts") return genericTable("Contacts");
      if (tab === "pipeline") return genericTable("Pipeline");
      if (tab === "emails") return genericTable("Email Drafts");
    }

    document.querySelectorAll("nav button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        renderTab(btn.dataset.tab);
      });
    });

    document.getElementById("signInBtn").addEventListener("click", signIn);
    document.getElementById("refreshBtn").addEventListener("click", loadWorkbook);

    initMsal();
  </script>
</body>

</html>
