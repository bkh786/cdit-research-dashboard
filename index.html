<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CDIT Sales Intelligence Dashboard</title>
<style>
  :root{
    --bg:#0f172a; --panel:#111827; --panel2:#1a2234; --border:#26314a;
    --text:#e5e7eb; --muted:#94a3b8; --accent:#6366f1; --accent-soft:rgba(99,102,241,.15);
    --high:#ef4444; --med:#f59e0b; --low:#22c55e; --star:#f59e0b; --row-hover:#161f33;
  }
  html[data-theme="light"]{
    --bg:#f4f5f9; --panel:#ffffff; --panel2:#ffffff; --border:#e2e6ee;
    --text:#0f172a; --muted:#5b6577; --row-hover:#f1f3fa;
  }
  html[data-accent="teal"]{ --accent:#0d9488; --accent-soft:rgba(13,148,136,.15); }
  html[data-accent="rose"]{ --accent:#e11d48; --accent-soft:rgba(225,29,72,.15); }
  html[data-accent="amber"]{ --accent:#d97706; --accent-soft:rgba(217,119,6,.15); }
  html[data-accent="indigo"]{ --accent:#6366f1; --accent-soft:rgba(99,102,241,.15); }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
  header{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:10;}
  header h1{font-size:18px;margin:0;font-weight:600;}
  header .sub{color:var(--muted);font-size:12px;margin-top:2px;}
  .btn{background:var(--accent);color:#fff;border:none;padding:9px 16px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600;}
  .btn.secondary{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn.tiny{padding:5px 10px;font-size:11px;border-radius:6px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  nav{display:flex;gap:4px;padding:0 28px;border-bottom:1px solid var(--border);background:var(--panel);overflow-x:auto;}
  nav button{background:none;border:none;color:var(--muted);padding:12px 14px;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
  nav button.active{color:var(--text);border-bottom-color:var(--accent);}
  main{padding:24px 28px;max-width:1400px;margin:0 auto;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px;}
  .card{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:16px;}
  .card .num{font-size:26px;font-weight:700;}
  .card .label{color:var(--muted);font-size:12px;margin-top:4px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel);white-space:nowrap;}
  td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top;overflow-wrap:anywhere;max-width:340px;}
  tr:hover td{background:var(--row-hover);}
  .panel{background:var(--panel2);border:1px solid var(--border);border-radius:12px;overflow:auto;max-height:70vh;}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;}
  .pill.High{background:rgba(239,68,68,.15);color:var(--high);}
  .pill.Medium{background:rgba(245,158,11,.15);color:var(--med);}
  .pill.Low{background:rgba(34,197,94,.15);color:var(--low);}
  .toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
  input[type=text],input[type=password]{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:13px;min-width:220px;}
  select{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:8px;font-size:13px;}
  .empty{padding:60px 20px;text-align:center;color:var(--muted);}
  .gate{display:flex;align-items:center;justify-content:center;height:80vh;flex-direction:column;gap:14px;}
  .gate .box{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:28px;width:320px;text-align:center;}
  .error-text{color:var(--high);font-size:12px;margin-top:8px;}
  a{color:var(--accent);text-decoration:none;}
  a:hover{text-decoration:underline;}
  a.brand-link{color:var(--text);font-weight:600;}
  a.brand-link:hover{color:var(--accent);}
  .score{font-weight:700;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:100;}
  .modal{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:24px;width:420px;max-width:90vw;}
  .modal h3{margin:0 0 16px;font-size:16px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;}
  .field input,.field select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:8px;font-size:13px;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;}

  /* Theme switcher */
  .theme-switcher{position:relative;}
  .theme-btn{background:transparent;border:1px solid var(--border);color:var(--text);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:15px;}
  .theme-menu{position:absolute;right:0;top:42px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;width:200px;box-shadow:0 12px 32px rgba(0,0,0,.35);display:none;z-index:50;}
  .theme-menu.open{display:block;}
  .theme-menu .row-label{font-size:11px;color:var(--muted);margin:0 0 6px;text-transform:uppercase;letter-spacing:.04em;}
  .mode-toggle{display:flex;gap:6px;margin-bottom:14px;}
  .mode-toggle button{flex:1;padding:6px 0;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:12px;cursor:pointer;}
  .mode-toggle button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .accent-dots{display:flex;gap:8px;}
  .accent-dot{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
  .accent-dot.active{border-color:var(--text);}

  /* Brand detail page */
  .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;margin-bottom:16px;cursor:pointer;}
  .detail-grid{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start;}
  @media (max-width:900px){ .detail-grid{grid-template-columns:1fr;} }
  .detail-header{display:flex;align-items:baseline;gap:12px;margin-bottom:6px;flex-wrap:wrap;}
  .detail-header h2{margin:0;font-size:24px;}
  .section{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:18px;}
  .section h3{margin:0 0 12px;font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
  .exec-summary{font-size:14px;line-height:1.7;overflow-wrap:anywhere;}
  .stars{color:var(--star);font-size:20px;letter-spacing:2px;}
  .stars .empty-star{color:var(--border);}
  .score-value{font-size:13px;color:var(--muted);margin-top:4px;}
  .score-line-label{font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600;}
  .news-item{border-bottom:1px solid var(--border);padding:14px 0;}
  .news-item:last-child{border-bottom:none;}
  .news-item .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px;font-size:11px;color:var(--muted);}
  .news-item h4{margin:0 0 6px;font-size:14px;overflow-wrap:anywhere;}
  .news-item p{margin:0 0 6px;font-size:13px;line-height:1.6;color:var(--text);overflow-wrap:anywhere;}
  .cat-tag{background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:999px;font-weight:700;white-space:nowrap;}

  /* Competitor Watch cards */
  .competitor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px;align-items:start;}
  .competitor-card{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:18px;cursor:pointer;transition:border-color .15s,transform .15s;min-width:0;}
  .competitor-card:hover{border-color:var(--accent);}
  .competitor-card .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:11px;color:var(--muted);}
  .competitor-card h4{margin:0 0 8px;font-size:14.5px;line-height:1.4;overflow-wrap:anywhere;}
  .competitor-card p{margin:0;font-size:13px;line-height:1.65;color:var(--text);overflow-wrap:anywhere;}
  .competitor-card .expand{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
  .competitor-card .expand p{margin-bottom:8px;}
  .competitor-card .expand-hint{margin-top:10px;font-size:11px;color:var(--accent);font-weight:600;}

  .filter-pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .filter-pill{background:var(--panel2);border:1px solid var(--border);color:var(--muted);padding:6px 14px;border-radius:999px;font-size:12px;cursor:pointer;font-weight:600;}
  .filter-pill.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .filter-pill:hover{border-color:var(--accent);}

  .track-brand-btn{margin-top:12px;background:transparent;border:1px solid var(--accent);color:var(--accent);padding:6px 12px;border-radius:8px;font-size:11px;cursor:pointer;font-weight:700;}
  .track-brand-btn:hover{background:var(--accent-soft);}
  .track-brand-btn:disabled{opacity:.65;cursor:default;border-color:var(--border);color:var(--muted);}

  .ai-draft-bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
  .email-hook{font-size:15px;font-weight:700;margin:0 0 12px;color:var(--accent);}
  .spinner-text{font-size:12px;color:var(--muted);}
  .contact-card .cf{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;gap:10px;}
  .contact-card .cf:last-child{border-bottom:none;}
  .contact-card .cf-label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.03em;}
  .contact-card .cf-value{text-align:right;word-break:break-word;}
  .copy-btn{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;flex-shrink:0;}
  .copy-btn:hover{color:var(--accent);border-color:var(--accent);}
  .email-box{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:20px;font-size:13px;line-height:1.7;}
  .email-box p{margin:0 0 12px;}
  .email-subject{font-weight:700;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border);}
  .draft-note{font-size:11px;color:var(--muted);margin-top:10px;}
  .pipeline-editor{display:flex;gap:8px;align-items:center;margin-top:10px;}
  .save-note{font-size:11px;color:var(--low);margin-top:6px;display:none;}
</style>
</head>
<body>

<header>
  <div>
    <h1>CDIT Sales Intelligence Dashboard</h1>
    <div class="sub" id="syncStatus">Locked</div>
  </div>
  <div style="display:flex;gap:10px;align-items:center;">
    <button class="btn secondary" id="addBrandBtn" style="display:none;">+ Add Brand</button>
    <button class="btn secondary" id="refreshBtn" style="display:none;">Refresh</button>
    <div class="theme-switcher" id="themeSwitcher" style="display:none;">
      <button class="theme-btn" id="themeBtn" title="Appearance">&#9788;</button>
      <div class="theme-menu" id="themeMenu">
        <div class="row-label">Mode</div>
        <div class="mode-toggle">
          <button data-mode="dark">Dark</button>
          <button data-mode="light">Light</button>
        </div>
        <div class="row-label">Accent</div>
        <div class="accent-dots">
          <div class="accent-dot" data-accent="indigo" style="background:#6366f1;"></div>
          <div class="accent-dot" data-accent="teal" style="background:#0d9488;"></div>
          <div class="accent-dot" data-accent="rose" style="background:#e11d48;"></div>
          <div class="accent-dot" data-accent="amber" style="background:#d97706;"></div>
        </div>
      </div>
    </div>
  </div>
</header>

<nav id="tabs" style="display:none;">
  <button data-tab="overview" class="active">Overview</button>
  <button data-tab="news">News Feed</button>
  <button data-tab="opportunities">Opportunities</button>
  <button data-tab="contacts">Contacts</button>
  <button data-tab="competitors">Competitor Watch</button>
  <button data-tab="emails">Email Drafts</button>
</nav>

<main>
  <div id="content">
    <div class="gate">
      <div class="box">
        <div style="margin-bottom:14px;font-weight:600;">Enter dashboard password</div>
        <input type="password" id="pwInput" placeholder="Password" style="width:100%;margin-bottom:10px;" />
        <button class="btn" id="unlockBtn" style="width:100%;">Unlock</button>
        <div class="error-text" id="pwError"></div>
      </div>
    </div>
  </div>
</main>

<script>
let workbookData = {};
let currentTab = "overview";

function saveSessionPassword(pw){ sessionStorage.setItem("cdit_pw", pw); }
function getSessionPassword(){ return sessionStorage.getItem("cdit_pw") || ""; }

/* ---------------- Theme switcher ---------------- */
function applyTheme(){
  const mode = localStorage.getItem("cdit_theme") || "dark";
  const accent = localStorage.getItem("cdit_accent") || "indigo";
  document.documentElement.setAttribute("data-theme", mode);
  document.documentElement.setAttribute("data-accent", accent);
  document.querySelectorAll(".mode-toggle button").forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
  document.querySelectorAll(".accent-dot").forEach(d => d.classList.toggle("active", d.dataset.accent === accent));
}
function initThemeControls(){
  document.querySelectorAll(".mode-toggle button").forEach(b => {
    b.addEventListener("click", () => { localStorage.setItem("cdit_theme", b.dataset.mode); applyTheme(); });
  });
  document.querySelectorAll(".accent-dot").forEach(d => {
    d.addEventListener("click", () => { localStorage.setItem("cdit_accent", d.dataset.accent); applyTheme(); });
  });
  document.getElementById("themeBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    document.getElementById("themeMenu").classList.toggle("open");
  });
  document.addEventListener("click", () => document.getElementById("themeMenu").classList.remove("open"));
  applyTheme();
}

async function unlock(){
  const pw = document.getElementById("pwInput").value;
  document.getElementById("pwError").textContent = "";
  const ok = await loadWorkbook(pw);
  if (ok) {
    saveSessionPassword(pw);
    revealChrome();
    renderTab(currentTab);
  } else {
    document.getElementById("pwError").textContent = "Incorrect password or sync failed.";
  }
}

function revealChrome(){
  document.getElementById("tabs").style.display = "flex";
  document.getElementById("refreshBtn").style.display = "inline-block";
  document.getElementById("addBrandBtn").style.display = "inline-block";
  document.getElementById("themeSwitcher").style.display = "block";
}

async function loadWorkbook(pw){
  document.getElementById("syncStatus").textContent = "Loading...";
  try {
    const resp = await fetch("/api/sheet-data", {
      headers: { "x-dashboard-password": pw }
    });
    if (resp.status === 401) {
      document.getElementById("syncStatus").textContent = "Locked";
      return false;
    }
    if (!resp.ok) throw new Error("API error " + resp.status);
    const json = await resp.json();
    workbookData = json.sheets;
    document.getElementById("syncStatus").textContent = "Live — last synced " + new Date(json.syncedAt).toLocaleString();
    return true;
  } catch (e) {
    console.error(e);
    document.getElementById("syncStatus").textContent = "Sync failed: " + e.message;
    return false;
  }
}

async function refresh(){
  const pw = getSessionPassword();
  const ok = await loadWorkbook(pw);
  if (ok) {
    if (window.__viewingBrand) renderBrandDetail(window.__viewingBrand);
    else renderTab(currentTab);
  }
}

/* ---------------- Add Brand ---------------- */
function openAddBrandModal(){
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "addBrandOverlay";
  overlay.innerHTML = `
    <div class="modal">
      <h3>Add a brand to track</h3>
      <div class="field"><label>Brand name</label><input id="fBrand" type="text" placeholder="e.g. Fire-Boltt"></div>
      <div class="field"><label>Sector</label><input id="fSector" type="text" placeholder="e.g. Consumer Electronics"></div>
      <div class="field"><label>Segment</label><input id="fSegment" type="text" placeholder="e.g. Wearables, Audio"></div>
      <div class="field"><label>Priority Tier</label>
        <select id="fTier"><option>High</option><option>Medium</option><option selected>Low</option></select>
      </div>
      <div class="field"><label>Website</label><input id="fWebsite" type="text" placeholder="e.g. fire-boltt.com"></div>
      <div class="field"><label>HQ / India Office</label><input id="fHQ" type="text" placeholder="e.g. Gurugram, Haryana"></div>
      <div class="error-text" id="addBrandError"></div>
      <div class="modal-actions">
        <button class="btn secondary" id="cancelAddBrand">Cancel</button>
        <button class="btn" id="submitAddBrand">Add Brand</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById("cancelAddBrand").addEventListener("click", () => overlay.remove());
  document.getElementById("submitAddBrand").addEventListener("click", submitAddBrand);
}

async function submitAddBrand(){
  const brandName = document.getElementById("fBrand").value.trim();
  const errEl = document.getElementById("addBrandError");
  if (!brandName) { errEl.textContent = "Brand name is required."; return; }

  const today = new Date().toISOString().slice(0, 10);
  const brandRow = {
    "Brand": brandName,
    "Sector": document.getElementById("fSector").value.trim(),
    "Segment": document.getElementById("fSegment").value.trim(),
    "Priority Tier": document.getElementById("fTier").value,
    "Website": document.getElementById("fWebsite").value.trim(),
    "HQ / India Office": document.getElementById("fHQ").value.trim(),
    "Status Notes": "Added manually via dashboard — not yet researched.",
    "Date Added": today,
  };
  const pipelineRow = { "Brand": brandName, "Stage": "Prospect", "Owner": "", "Last Update": today, "Next Follow-up Date": "", "Notes": "Awaiting first research pass." };

  const btn = document.getElementById("submitAddBrand");
  btn.disabled = true; btn.textContent = "Adding...";
  try {
    const resp = await fetch("/api/sheet-write", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-dashboard-password": getSessionPassword() },
      body: JSON.stringify({ action: "addBrand", brand: brandRow, pipeline: pipelineRow })
    });
    const data = await resp.json();
    if (!resp.ok || data.error) throw new Error(data.error || "Failed to add brand");
    document.getElementById("addBrandOverlay").remove();
    await refresh();
  } catch (e) {
    errEl.textContent = e.message;
    btn.disabled = false; btn.textContent = "Add Brand";
  }
}

/* ---------------- Pipeline stage update ---------------- */
async function updatePipelineStage(brandName, newStage, btnEl, noteEl){
  btnEl.disabled = true;
  const oldText = btnEl.textContent;
  btnEl.textContent = "Saving...";
  try {
    const today = new Date().toISOString().slice(0, 10);
    const resp = await fetch("/api/sheet-write", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-dashboard-password": getSessionPassword() },
      body: JSON.stringify({
        action: "updateRow",
        sheet: "Pipeline",
        matchColumn: "Brand",
        matchValue: brandName,
        updates: { "Stage": newStage, "Last Update": today }
      })
    });
    const data = await resp.json();
    if (!resp.ok || data.error) throw new Error(data.error || "Failed to update stage");
    noteEl.textContent = "Saved.";
    noteEl.style.display = "block";
    await refresh();
  } catch (e) {
    noteEl.textContent = "Failed: " + e.message;
    noteEl.style.display = "block";
    noteEl.style.color = "var(--high)";
  } finally {
    btnEl.disabled = false;
    btnEl.textContent = oldText;
  }
}

/* ---------------- Shared helpers ---------------- */
function priorityLabel(score){
  score = Number(score) || 0;
  if (score >= 4) return "High";
  if (score === 3) return "Medium";
  return "Low";
}
function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function escapeAttr(s){ return escapeHtml(s).replace(/`/g, "&#96;"); }
function starRow(score, max){
  max = max || 5;
  score = Math.round(Number(score) || 0);
  let out = "";
  for (let i = 1; i <= max; i++) out += i <= score ? "&#9733;" : `<span class="empty-star">&#9733;</span>`;
  return `<span class="stars">${out}</span>`;
}
function brandLink(name){
  if (!name) return "";
  return `<a class="brand-link" href="#" onclick="showBrandDetail('${escapeAttr(name).replace(/'/g,"&#39;")}');return false;">${escapeHtml(name)}</a>`;
}
function sortByDateDesc(rows, field){
  return rows.slice().sort((a, b) => String(b[field] || "").localeCompare(String(a[field] || "")));
}

/* ---------------- Overview / generic tabs ---------------- */
function renderOverview(){
  window.__viewingBrand = null;
  const brands = workbookData["Brands Master"] || [];
  const opps = workbookData["Opportunities"] || [];
  const pipeline = workbookData["Pipeline"] || [];
  const high = opps.filter(o => Number(o["Priority Score (1-5)"]) >= 4).length;
  const dormant = opps.filter(o => Number(o["Priority Score (1-5)"]) <= 2).length;
  const pipelineByBrand = Object.fromEntries(pipeline.map(p => [p["Brand"], p["Stage"]]));
  const topOppByBrand = {};
  opps.forEach(o => {
    const b = o["Brand"];
    if (!topOppByBrand[b] || Number(o["Priority Score (1-5)"]) > Number(topOppByBrand[b]["Priority Score (1-5)"])) {
      topOppByBrand[b] = o;
    }
  });
  const rows = brands.map(b => {
    const top = topOppByBrand[b["Brand"]];
    return `<tr>
      <td>${brandLink(b["Brand"])}</td>
      <td><span class="pill ${escapeHtml(b["Priority Tier"])}">${escapeHtml(b["Priority Tier"])}</span></td>
      <td>${escapeHtml(top ? top["Opportunity Type"] : "-")}</td>
      <td class="score">${top ? escapeHtml(top["Priority Score (1-5)"]) : "-"}</td>
      <td>${escapeHtml(pipelineByBrand[b["Brand"]] || "-")}</td>
      <td>${escapeHtml(b["Date Added"] || "-")}</td>
    </tr>`;
  }).join("");
  document.getElementById("content").innerHTML = `
    <div class="cards">
      <div class="card"><div class="num">${brands.length}</div><div class="label">Brands Tracked</div></div>
      <div class="card"><div class="num">${opps.length}</div><div class="label">Open Opportunities</div></div>
      <div class="card"><div class="num" style="color:var(--high)">${high}</div><div class="label">High Priority (4-5)</div></div>
      <div class="card"><div class="num" style="color:var(--low)">${dormant}</div><div class="label">Dormant / Low Priority</div></div>
    </div>
    <div class="panel">
      <table>
        <thead><tr><th>Brand</th><th>Priority Tier</th><th>Top Opportunity</th><th>Score</th><th>Pipeline Stage</th><th>Date Added</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}
function genericTable(sheetName, opts){
  window.__viewingBrand = null;
  opts = opts || {};
  let rows = workbookData[sheetName] || [];
  if (opts.sortDateField) rows = sortByDateDesc(rows, opts.sortDateField);
  const cols = rows[0] ? Object.keys(rows[0]) : [];
  const thead = `<tr>${cols.map(c => `<th>${escapeHtml(c)}</th>`).join("")}</tr>`;
  const tbody = rows.map(r => `<tr>${cols.map(c =>
    `<td>${c === "Brand" ? brandLink(r[c]) : escapeHtml(r[c])}</td>`
  ).join("")}</tr>`).join("");
  document.getElementById("content").innerHTML = `
    <div class="toolbar"><input type="text" id="searchBox" placeholder="Search ${escapeHtml(sheetName)}..."></div>
    <div class="panel"><table id="dataTable"><thead>${thead}</thead><tbody>${tbody}</tbody></table></div>`;
  wireSearch();
}
function renderOpportunities(){
  window.__viewingBrand = null;
  const rows = workbookData["Opportunities"] || [];
  const cols = rows[0] ? Object.keys(rows[0]) : [];
  const thead = `<tr>${cols.map(c => `<th>${escapeHtml(c)}</th>`).join("")}</tr>`;
  const tbody = rows.slice()
    .sort((a,b) => Number(b["Priority Score (1-5)"]) - Number(a["Priority Score (1-5)"]))
    .map(r => {
      const label = priorityLabel(r["Priority Score (1-5)"]);
      return `<tr>${cols.map(c => {
        if (c === "Priority Score (1-5)") return `<td><span class="pill ${label}">${escapeHtml(r[c])} · ${label}</span></td>`;
        if (c === "Brand") return `<td>${brandLink(r[c])}</td>`;
        return `<td>${escapeHtml(r[c])}</td>`;
      }).join("")}</tr>`;
    }).join("");
  document.getElementById("content").innerHTML = `
    <div class="toolbar"><input type="text" id="searchBox" placeholder="Search opportunities..."></div>
    <div class="panel"><table id="dataTable"><thead>${thead}</thead><tbody>${tbody}</tbody></table></div>`;
  wireSearch();
}

/* ---------------- Competitor Watch ---------------- */
function renderCompetitors(){
  window.__viewingBrand = null;
  const rows = workbookData["Competitor Watch"] || [];
  if (!rows.length) {
    document.getElementById("content").innerHTML = `<div class="empty">No competitor/adjacent-player entries yet.</div>`;
    return;
  }
  const trackedBrands = new Set((workbookData["Brands Master"] || []).map(b => b["Brand"]));
  const sorted = sortByDateDesc(rows, "Date");
  const competitorNames = [...new Set(sorted.map(r => r["Competitor"]).filter(Boolean))].sort();
  const activeFilter = window.__competitorFilter || "All";
  const filterOptions = ["All", ...competitorNames];
  const pills = filterOptions.map(c => `
    <button class="filter-pill ${c === activeFilter ? "active" : ""}" onclick="setCompetitorFilter('${escapeAttr(c).replace(/'/g, "&#39;")}')">${escapeHtml(c)}</button>`).join("");
  const visible = activeFilter === "All" ? sorted : sorted.filter(r => r["Competitor"] === activeFilter);
  const list = visible.map((r, i) => {
    const competitorName = r["Competitor"] || "";
    const isTracked = competitorName && trackedBrands.has(competitorName);
    const trackBtn = competitorName ? `
      <div><button class="track-brand-btn" ${isTracked ? "disabled" : ""} onclick="event.stopPropagation(); addCompetitorAsTrackedBrand('${escapeAttr(competitorName).replace(/'/g, "&#39;")}', this)">${isTracked ? "Already tracked &#10003;" : "+ Track this brand"}</button></div>` : "";
    return `
    <div class="competitor-card" onclick="toggleCompetitorItem(${i})">
      <div class="meta"><span class="cat-tag">${escapeHtml(r["Category"] || r["Related Tracked Brand"] || "")}</span><span>${escapeHtml(r["Date"])}</span><span>· ${escapeHtml(r["Source"])}</span></div>
      <h4>${escapeHtml(r["Headline"])}</h4>
      <p>${escapeHtml(r["Summary"])}</p>
      <div id="competitor-expand-${i}" class="expand">
        <p><strong>Competitor:</strong> ${escapeHtml(r["Competitor"])} &nbsp;·&nbsp; <strong>Related to your brand:</strong> ${escapeHtml(r["Related Tracked Brand"])}</p>
        <p>${escapeHtml(r["Full Analysis"] || r["Summary"])}</p>
        ${r["URL"] ? `<a href="${escapeAttr(r["URL"])}" target="_blank" rel="noopener" onclick="event.stopPropagation()">View source &#8594;</a>` : ""}
      </div>
      <div class="expand-hint" id="competitor-hint-${i}">Click to expand full analysis &#8595;</div>
      ${trackBtn}
    </div>`;
  }).join("");
  document.getElementById("content").innerHTML = `
    <div class="toolbar"><input type="text" id="searchBox" placeholder="Search competitor watch..."></div>
    <div class="filter-pills">${pills}</div>
    <div class="competitor-grid">${list}</div>`;
  wireSearch();
}
function setCompetitorFilter(c){
  window.__competitorFilter = c;
  renderCompetitors();
}
function toggleCompetitorItem(i){
  const el = document.getElementById(`competitor-expand-${i}`);
  const hint = document.getElementById(`competitor-hint-${i}`);
  const open = el.style.display === "block";
  el.style.display = open ? "none" : "block";
  hint.innerHTML = open ? "Click to expand full analysis &#8595;" : "Click to collapse &#8593;";
}
async function addCompetitorAsTrackedBrand(brandName, btnEl){
  btnEl.disabled = true;
  btnEl.textContent = "Researching (Gemini)...";
  try {
    const resp = await fetch("/api/research-brand", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-dashboard-password": getSessionPassword() },
      body: JSON.stringify({ brand: brandName })
    });
    const data = await resp.json();
    if (!resp.ok || data.error) throw new Error(data.error || "Research failed");
    btnEl.textContent = "Added ✓";
    await refresh();
  } catch (e) {
    btnEl.textContent = "Failed — retry";
    btnEl.disabled = false;
    alert("Couldn't add " + brandName + ": " + e.message);
  }
}

function wireSearch(){
  const box = document.getElementById("searchBox");
  if (!box) return;
  box.addEventListener("input", (e) => {
    const q = e.target.value.toLowerCase();
    document.querySelectorAll("#dataTable tbody tr, .news-item, .competitor-card").forEach(tr => {
      tr.style.display = tr.textContent.toLowerCase().includes(q) ? "" : "none";
    });
  });
}
function renderTab(tab){
  currentTab = tab;
  window.__viewingBrand = null;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  if (!workbookData["Brands Master"]) return;
  if (tab === "overview") return renderOverview();
  if (tab === "news") return genericTable("News feed", { sortDateField: "Date" });
  if (tab === "opportunities") return renderOpportunities();
  if (tab === "contacts") return genericTable("Contacts");
  if (tab === "competitors") return renderCompetitors();
  if (tab === "emails") return genericTable("Email Drafts");
}

/* ---------------- Brand detail page ---------------- */
function copyToClipboard(text, btnEl){
  navigator.clipboard.writeText(text).then(() => {
    if (btnEl) {
      const old = btnEl.textContent;
      btnEl.textContent = "Copied";
      setTimeout(() => { btnEl.textContent = old; }, 1500);
    }
  });
}
function copyEmailRich(subject, htmlBody, btnEl){
  const plain = subject + "\n\n" + htmlBody.replace(/<[^>]+>/g, "").replace(/\n{3,}/g, "\n\n");
  const richHtml = `<p><strong>Subject: ${subject}</strong></p>${htmlBody}`;
  try {
    const item = new ClipboardItem({
      "text/plain": new Blob([plain], { type: "text/plain" }),
      "text/html": new Blob([richHtml], { type: "text/html" }),
    });
    navigator.clipboard.write([item]).then(() => flashCopied(btnEl));
  } catch (e) {
    copyToClipboard(plain, btnEl);
  }
}
function flashCopied(btnEl){
  if (!btnEl) return;
  const old = btnEl.textContent;
  btnEl.textContent = "Copied — paste into Outlook/Gmail";
  setTimeout(() => { btnEl.textContent = old; }, 2000);
}

async function generateAiEmailDraft(brandName, brand, topOpp, allNews, contact, btnEl){
  const statusEl = document.getElementById("aiDraftStatus");
  btnEl.disabled = true;
  statusEl.textContent = "Reading recent news + channelplay.in, drafting with Gemini...";
  try {
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - 60);
    const recentNews = (allNews || [])
      .filter(n => {
        const d = new Date(n["Date"]);
        return isNaN(d) ? true : d >= cutoff;
      })
      .slice(0, 8)
      .map(n => ({
        date: n["Date"], headline: n["Headline"],
        summary: n["AI Summary"] || n["Summary"] || "",
        source: n["Source"], category: n["Category"]
      }));

    const resp = await fetch("/api/generate-email", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-dashboard-password": getSessionPassword() },
      body: JSON.stringify({
        brand: brandName,
        sector: brand["Sector"] || "",
        segment: brand["Segment"] || "",
        topOpportunity: topOpp ? {
          type: topOpp["Opportunity Type"], businessImpact: topOpp["Business Impact"],
          opportunityForChannelplay: topOpp["Opportunity for Channelplay"],
          recommendedService: topOpp["Recommended Service"], nextAction: topOpp["Suggested Next Action"]
        } : null,
        recentNews,
        contactName: contact ? contact["Decision Maker Name"] : "",
        contactDesignation: contact ? contact["Designation"] : "",
      })
    });
    const data = await resp.json();
    if (!resp.ok || data.error) throw new Error(data.error || "Generation failed");

    window.__emailDraftState = { subject: data.subject, bodyHtml: data.bodyHtml };
    document.getElementById("emailSubjectLine").textContent = data.subject;
    document.getElementById("emailBodyContent").innerHTML = data.bodyHtml;
    document.getElementById("emailDraftNote").textContent = "AI-generated just now via Gemini — grounded in this brand's recent news and live channelplay.in content.";
    statusEl.textContent = "Draft ready.";

    // Best-effort: log the generated draft to the Email Drafts sheet for a record.
    fetch("/api/sheet-write", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-dashboard-password": getSessionPassword() },
      body: JSON.stringify({
        action: "appendRows", sheet: "Email Drafts",
        rows: [{ "Brand": brandName, "Subject": data.subject, "Draft Body": data.plainBody || "" }]
      })
    }).catch(() => {});
  } catch (e) {
    statusEl.textContent = "Failed: " + e.message;
  } finally {
    btnEl.disabled = false;
  }
}

function buildExecSummary(brand, topOpp, news, pipelineRow){
  if (!topOpp) {
    return `${escapeHtml(brand["Brand"])} is being tracked but has not yet been through a full research and scoring pass. ${brand["Status Notes"] ? escapeHtml(brand["Status Notes"]) : "Check back after the next research cycle for an executive summary, scored opportunities, and a drafted outreach email."}`;
  }
  const latestDate = news[0] ? escapeHtml(news[0]["Date"]) : "an unspecified recent date";
  return `${escapeHtml(brand["Brand"])} is currently rated <strong>${escapeHtml(brand["Priority Tier"] || priorityLabel(topOpp["Priority Score (1-5)"]))} priority</strong>,
    with an opportunity score of ${escapeHtml(topOpp["Priority Score (1-5)"])}/5 and a confidence level of ${escapeHtml(topOpp["Confidence Score (1-5)"])}/5.
    Across ${news.length} tracked news item${news.length === 1 ? "" : "s"} (most recently ${latestDate}), the dominant signal is
    <strong>${escapeHtml(topOpp["Opportunity Type"])}</strong>: ${escapeHtml(topOpp["Business Impact"])}
    ${escapeHtml(topOpp["Opportunity for Channelplay"])}
    ${pipelineRow ? ` This account is currently at the <strong>${escapeHtml(pipelineRow["Stage"])}</strong> stage in the pipeline.` : ""}
    Recommended next step: ${escapeHtml(topOpp["Suggested Next Action"])}`;
}

function buildEmailDraft(brand, topOpp, news, sheetDraft){
  if (sheetDraft) {
    return {
      subject: sheetDraft["Subject"],
      bodyHtml: String(sheetDraft["Draft Body"] || "").split(/\n{2,}/).map(p => `<p>${escapeHtml(p)}</p>`).join(""),
      isTemplate: false
    };
  }
  if (!topOpp) {
    return { subject: `${brand["Brand"]} — Channelplay introduction`, bodyHtml: `<p>No opportunity data yet — a drafted email will appear here once this brand has been through a research pass.</p>`, isTemplate: true };
  }
  const latestNews = news[0];
  const subject = `Supporting ${brand["Brand"]}'s ${String(topOpp["Opportunity Type"]).toLowerCase()} with Channelplay`;
  const bodyHtml = `
    <p>Hi [Name],</p>
    <p>I noticed <strong>${escapeHtml(brand["Brand"])}</strong>'s recent move${latestNews ? ` — <em>${escapeHtml(latestNews["Headline"])}</em> (${escapeHtml(latestNews["Date"])}, ${escapeHtml(latestNews["Source"])})` : ""}.
    ${escapeHtml(topOpp["Business Impact"])}</p>
    <p>At Channelplay, we support brands through moments like this with <strong>${escapeHtml(topOpp["Recommended Service"])}</strong>.
    ${escapeHtml(topOpp["Opportunity for Channelplay"])}</p>
    <p>Would you be open to a short call to explore ${escapeHtml(String(topOpp["Suggested Next Action"]).replace(/\.$/,""))}?</p>
    <p>Best regards,<br>Bikash Roy<br>Group Program Manager, Channelplay</p>
  `;
  return { subject, bodyHtml, isTemplate: true };
}

function renderContactCard(contact){
  if (!contact || (!contact["Decision Maker Name"] && !contact["Official Email (public only)"])) {
    return `<div class="empty" style="padding:10px 0;">Contact research pending${contact && contact["Research Status"] ? " — " + escapeHtml(contact["Research Status"]) : ""}.</div>`;
  }
  const rows = [
    ["Name", contact["Decision Maker Name"]],
    ["Designation", contact["Designation"]],
    ["Department", contact["Department"]],
    ["Email", contact["Official Email (public only)"]],
    ["Phone", contact["Official Contact Number (public only)"]],
    ["Location", contact["Office Location"]],
  ].filter(([, v]) => v);
  let html = rows.map(([label, val]) => `
    <div class="cf">
      <div><div class="cf-label">${label}</div><div class="cf-value">${escapeHtml(val)}</div></div>
      <button class="copy-btn" data-copy="${escapeAttr(val)}">Copy</button>
    </div>`).join("");
  if (contact["LinkedIn Profile"] && !/not yet|not researched|search /i.test(contact["LinkedIn Profile"])) {
    html += `<div class="cf"><div><div class="cf-label">LinkedIn</div><div class="cf-value"><a href="${escapeAttr(contact["LinkedIn Profile"])}" target="_blank" rel="noopener">Profile &#8594;</a></div></div></div>`;
  }
  return html || `<div class="empty" style="padding:10px 0;">Contact research pending.</div>`;
}
