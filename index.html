<!DOCTYPE html>
<html lang="en" data-theme="light" data-accent="indigo">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Brand Research &amp; Insights — Sales Intelligence</title>
<meta name="robots" content="noindex,nofollow" />
<meta name="description" content="Track brands, spot retail-execution signals, find decision-makers and draft outreach — powered by your own Google Sheet and Gemini." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234f46e5'/%3E%3Ctext x='32' y='41' font-family='Arial' font-weight='800' font-size='26' text-anchor='middle' fill='white'%3EBRI%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<script>
  // apply theme before first paint (no flash)
  try {
    var c = JSON.parse(localStorage.getItem("bri.config.v2") || "{}");
    document.documentElement.dataset.theme = c.theme || localStorage.getItem("cdit_theme") || "light";
    document.documentElement.dataset.accent = c.accent || localStorage.getItem("cdit_accent") || "indigo";
  } catch (e) {}
</script>
</head>
<body>

<!-- Password gate -->
<div class="gate" id="gate">
  <div class="card gate-card">
    <div class="logo-mark">BRI</div>
    <h1>Brand Research &amp; Insights</h1>
    <p>Enter the access password to open your sales-intelligence workspace.</p>
    <input class="input" type="password" id="pwInput" placeholder="Access password" autocomplete="current-password" style="margin-bottom:12px;text-align:center" />
    <button class="btn lg" id="unlockBtn" style="width:100%">Unlock</button>
    <div class="err" id="pwError" role="alert"></div>
  </div>
</div>

<!-- App -->
<div class="app hidden" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="logo" data-act="go" data-view="overview">
      <div class="logo-mark">BRI</div>
      <div class="logo-text"><b>Brand Research</b><span>&amp; Insights</span></div>
    </div>
    <div class="nav-label">Intelligence</div>
    <button class="nav" data-act="go" data-view="overview"></button>
    <button class="nav" data-act="go" data-view="signals"></button>
    <button class="nav" data-act="go" data-view="opportunities"></button>
    <button class="nav" data-act="go" data-view="contacts"></button>
    <button class="nav" data-act="go" data-view="pipeline"></button>
    <button class="nav" data-act="go" data-view="competitors"></button>
    <div class="nav-label">Workspace</div>
    <button class="nav" data-act="go" data-view="setup"></button>
    <button class="nav" data-act="go" data-view="settings"></button>
    <div class="side-foot">
      <button class="btn" data-act="add-brand" style="width:100%"></button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="tb-toggle" id="navToggle" title="Toggle sidebar" aria-label="Toggle sidebar"></button>
      <div class="search">
        <span id="searchIcon"></span>
        <input id="globalSearch" placeholder="Search brands, signals, people…" autocomplete="off" />
        <kbd>/</kbd>
        <div class="search-pop" id="searchPop"></div>
      </div>
      <div class="tb-right">
        <button class="status load" id="sheetStatus" data-act="go" data-view="setup" title="Google Sheet connection"><i></i><span>Connecting…</span></button>
        <button class="status hide-sm" id="aiStatus" data-act="go" data-view="setup" title="Gemini AI"><i></i><span>Gemini</span></button>
        <button class="iconbtn" id="refreshBtn" data-act="refresh" title="Refresh data"></button>
        <div class="menu" id="themeMenu">
          <button class="iconbtn" data-act="toggle-menu" title="Appearance" id="themeBtn"></button>
          <div class="menu-pop">
            <h5>Theme</h5>
            <div class="seg"><button data-act="theme" data-v="light">Light</button><button data-act="theme" data-v="dark">Dark</button></div>
            <h5>Accent</h5>
            <div class="swatches">
              <span class="sw" data-act="accent" data-v="indigo" style="background:#4f46e5" title="Indigo"></span>
              <span class="sw" data-act="accent" data-v="teal" style="background:#0f8a82" title="Teal"></span>
              <span class="sw" data-act="accent" data-v="emerald" style="background:#188a4a" title="Emerald"></span>
              <span class="sw" data-act="accent" data-v="rose" style="background:#d6385a" title="Rose"></span>
              <span class="sw" data-act="accent" data-v="amber" style="background:#c77a0a" title="Amber"></span>
            </div>
          </div>
        </div>
        <button class="iconbtn" data-act="lock" title="Lock" id="lockBtn"></button>
      </div>
    </header>
    <main id="content" class="page"></main>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/views.js"></script>
<script src="js/outreach.js"></script>
<script src="js/setup.js"></script>
<script>boot();</script>
</body>
</html>
