<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="indigo">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Consumer Electronics Brand’s Research — Sales Intelligence CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base: #090d16;
    --bg-surface: #0f172a;
    --bg-card: #141e33;
    --bg-card-hover: #1b2742;
    --bg-elevated: #1e293b;
    --border: #23314e;
    --border-light: rgba(255, 255, 255, 0.08);
    --border-focus: #6366f1;
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --accent: #6366f1;
    --accent-hover: #4f46e5;
    --accent-soft: rgba(99, 102, 241, 0.14);
    --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    --high: #f43f5e;
    --high-soft: rgba(244, 63, 94, 0.14);
    --med: #f59e0b;
    --med-soft: rgba(245, 158, 11, 0.14);
    --low: #10b981;
    --low-soft: rgba(16, 185, 129, 0.14);
    --info: #0ea5e9;
    --info-soft: rgba(14, 165, 233, 0.14);
    --star: #fbbf24;
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.25);
    --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);
    --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.45);
    --sidebar-w: 250px;
    --sidebar-w-collapsed: 72px;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
  }

  html[data-theme="light"] {
    --bg-base: #f8fafc;
    --bg-surface: #ffffff;
    --bg-card: #ffffff;
    --bg-card-hover: #f1f5f9;
    --bg-elevated: #e2e8f0;
    --border: #e2e8f0;
    --border-light: rgba(0, 0, 0, 0.06);
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #94a3b8;
    --high-soft: rgba(244, 63, 94, 0.12);
    --med-soft: rgba(245, 158, 11, 0.12);
    --low-soft: rgba(16, 185, 129, 0.12);
    --info-soft: rgba(14, 165, 233, 0.12);
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
    --shadow-md: 0 6px 18px rgba(0, 0, 0, 0.08);
    --shadow-lg: 0 12px 30px rgba(0, 0, 0, 0.12);
  }

  html[data-accent="teal"] {
    --accent: #0d9488; --accent-hover: #0f766e;
    --accent-soft: rgba(13, 148, 136, 0.14);
    --accent-gradient: linear-gradient(135deg, #0d9488 0%, #14b8a6 100%);
    --border-focus: #0d9488;
  }
  html[data-accent="rose"] {
    --accent: #e11d48; --accent-hover: #be123c;
    --accent-soft: rgba(225, 29, 72, 0.14);
    --accent-gradient: linear-gradient(135deg, #e11d48 0%, #f43f5e 100%);
    --border-focus: #e11d48;
  }
  html[data-accent="amber"] {
    --accent: #d97706; --accent-hover: #b45309;
    --accent-soft: rgba(217, 119, 6, 0.14);
    --accent-gradient: linear-gradient(135deg, #d97706 0%, #f59e0b 100%);
    --border-focus: #d97706;
  }
  html[data-accent="indigo"] {
    --accent: #6366f1; --accent-hover: #4f46e5;
    --accent-soft: rgba(99, 102, 241, 0.14);
    --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    --border-focus: #6366f1;
  }
  html[data-accent="emerald"] {
    --accent: #059669; --accent-hover: #047857;
    --accent-soft: rgba(5, 150, 105, 0.14);
    --accent-gradient: linear-gradient(135deg, #059669 0%, #10b981 100%);
    --border-focus: #059669;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg-base);
    color: var(--text-primary);
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 13.5px;
    line-height: 1.5;
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* App Layout */
  .app-container {
    display: flex;
    min-height: 100vh;
    width: 100%;
  }

  /* Sidebar */
  aside.sidebar {
    width: var(--sidebar-w);
    background: var(--bg-surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
    z-index: 40;
    transition: width 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    flex-shrink: 0;
    box-shadow: var(--shadow-sm);
  }
  aside.sidebar.collapsed {
    width: var(--sidebar-w-collapsed);
  }

  .sidebar-header {
    height: 68px;
    padding: 0 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  .brand-logo-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    overflow: hidden;
    white-space: nowrap;
  }
  .brand-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: var(--accent-gradient);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    font-weight: 800;
    font-size: 16px;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
  }
  .brand-title-group {
    display: flex;
    flex-direction: column;
    transition: opacity 0.2s, width 0.2s;
  }
  .sidebar.collapsed .brand-title-group {
    display: none;
  }
  .brand-main-title {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -0.01em;
    line-height: 1.2;
  }
  .brand-sub-title {
    font-size: 10.5px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .collapse-toggle-btn {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: var(--transition);
    flex-shrink: 0;
  }
  .collapse-toggle-btn:hover {
    color: var(--text-primary);
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .sidebar.collapsed .collapse-toggle-btn svg {
    transform: rotate(180deg);
  }
  .sidebar.collapsed .sidebar-header {
    justify-content: center;
    padding: 0;
  }
  .sidebar.collapsed .sidebar-header .brand-logo-wrap {
    display: none;
  }

  .sidebar-nav {
    padding: 16px 10px;
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .nav-section-label {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    padding: 8px 10px 4px;
    transition: opacity 0.2s;
  }
  .sidebar.collapsed .nav-section-label {
    display: none;
  }

  .nav-item-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    text-align: left;
    transition: var(--transition);
    position: relative;
    white-space: nowrap;
  }
  .nav-item-btn:hover {
    color: var(--text-primary);
    background: var(--bg-card-hover);
  }
  .nav-item-btn.active {
    color: #ffffff;
    background: var(--accent);
    font-weight: 600;
    box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
  }
  .nav-item-btn svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }
  .nav-item-label {
    flex: 1;
    transition: opacity 0.2s;
  }
  .sidebar.collapsed .nav-item-label {
    display: none;
  }
  .nav-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 999px;
    background: var(--bg-elevated);
    color: var(--text-secondary);
  }
  .nav-item-btn.active .nav-badge {
    background: rgba(255, 255, 255, 0.22);
    color: #ffffff;
  }
  .sidebar.collapsed .nav-badge {
    display: none;
  }
  .sidebar.collapsed .nav-item-btn {
    justify-content: center;
    padding: 10px 0;
  }

  /* Tooltip for collapsed sidebar */
  .sidebar.collapsed .nav-item-btn[data-title]:hover::after {
    content: attr(data-title);
    position: absolute;
    left: calc(100% + 12px);
    top: 50%;
    transform: translateY(-50%);
    background: var(--bg-surface);
    color: var(--text-primary);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-md);
    z-index: 100;
    pointer-events: none;
  }

  .sidebar-footer {
    padding: 14px 12px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .sidebar.collapsed .sidebar-footer {
    padding: 12px 6px;
  }

  /* Main Wrapper */
  .main-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  /* Top Header */
  header.top-header {
    height: 68px;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    position: sticky;
    top: 0;
    z-index: 30;
    backdrop-filter: blur(12px);
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .page-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .sync-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    font-size: 11px;
    font-weight: 500;
    color: var(--text-secondary);
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--low);
    box-shadow: 0 0 8px var(--low);
    animation: pulse 2s infinite;
  }
  .status-dot.locked {
    background: var(--high);
    box-shadow: 0 0 8px var(--high);
    animation: none;
  }
  .status-dot.loading {
    background: var(--med);
    box-shadow: 0 0 8px var(--med);
  }
  @keyframes pulse {
    0% { transform: scale(0.95); opacity: 0.8; }
    50% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(0.95); opacity: 0.8; }
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    background: var(--accent);
    color: #ffffff;
    border: none;
    padding: 8px 15px;
    border-radius: var(--radius-sm);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    text-decoration: none;
  }
  .btn:hover {
    background: var(--accent-hover);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
  }
  .btn:active {
    transform: translateY(0);
  }
  .btn.secondary {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-primary);
  }
  .btn.secondary:hover {
    background: var(--bg-card-hover);
    border-color: var(--accent);
    color: var(--accent);
  }
  .btn.tiny {
    padding: 5px 10px;
    font-size: 11px;
    border-radius: 6px;
  }
  .btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
    transform: none !important;
    box-shadow: none !important;
  }

  /* Theme Switcher */
  .theme-switcher { position: relative; }
  .icon-btn {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    width: 36px;
    height: 36px;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: var(--transition);
  }
  .icon-btn:hover {
    color: var(--text-primary);
    border-color: var(--accent);
  }
  .theme-menu {
    position: absolute;
    right: 0;
    top: 46px;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 16px;
    width: 220px;
    box-shadow: var(--shadow-lg);
    display: none;
    z-index: 100;
  }
  .theme-menu.open { display: block; }
  .theme-menu .row-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
  }
  .mode-toggle {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
  }
  .mode-toggle button {
    flex: 1;
    padding: 6px 0;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
  }
  .mode-toggle button.active {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
  }
  .accent-dots { display: flex; gap: 8px; }
  .accent-dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.15s;
  }
  .accent-dot:hover { transform: scale(1.15); }
  .accent-dot.active { border-color: var(--text-primary); transform: scale(1.1); }

  /* Content area */
  main.main-content {
    flex: 1;
    padding: 28px;
    max-width: 1560px;
    width: 100%;
    margin: 0 auto;
  }

  /* Password Gate View */
  .gate {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 75vh;
    flex-direction: column;
    padding: 20px;
  }
  .gate-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 36px 32px;
    width: 100%;
    max-width: 390px;
    text-align: center;
    box-shadow: var(--shadow-lg);
    position: relative;
    overflow: hidden;
  }
  .gate-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: var(--accent-gradient);
  }
  .gate-icon {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: var(--accent-soft);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 18px;
  }
  .gate-card h2 {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .gate-card p {
    color: var(--text-secondary);
    font-size: 12.5px;
    margin-bottom: 22px;
  }

  /* KPI Cards Grid */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .kpi-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 18px 20px;
    cursor: pointer;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .kpi-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }
  .kpi-card.active-filter {
    border-color: var(--accent);
    background: var(--accent-soft);
    box-shadow: 0 0 0 1px var(--accent), var(--shadow-md);
  }
  .kpi-card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .kpi-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .kpi-icon-wrap {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    background: var(--accent-soft);
  }
  .kpi-value {
    font-size: 30px;
    font-weight: 800;
    color: var(--text-primary);
    line-height: 1.1;
  }
  .kpi-hint {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid var(--border-light);
  }
  .kpi-filter-tag {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--accent);
    color: #ffffff;
    display: none;
  }
  .kpi-card.active-filter .kpi-filter-tag {
    display: inline-block;
  }

  /* Table Controls & Filter Bar */
  .table-controls-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .search-input-wrap {
    position: relative;
    flex: 1;
    min-width: 280px;
    max-width: 500px;
  }
  .search-input-wrap svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    width: 16px;
    height: 16px;
    pointer-events: none;
  }
  .search-input {
    width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 10px 14px 10px 38px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    outline: none;
    transition: var(--transition);
  }
  .search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .active-filter-banner {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    font-size: 12px;
    color: var(--text-primary);
    font-weight: 500;
  }
  .filter-clear-btn {
    background: transparent;
    border: none;
    color: var(--accent);
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
    text-decoration: underline;
  }

  /* CRM Panel & Table */
  .crm-panel {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .table-responsive {
    overflow-x: auto;
    max-height: 70vh;
  }
  table.crm-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    text-align: left;
  }
  table.crm-table thead th {
    background: var(--bg-surface);
    color: var(--text-secondary);
    font-weight: 600;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
    white-space: nowrap;
    user-select: none;
  }
  table.crm-table thead th.sortable {
    cursor: pointer;
    transition: background 0.15s;
  }
  table.crm-table thead th.sortable:hover {
    background: var(--bg-card-hover);
    color: var(--text-primary);
  }
  .th-content {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .sort-icon {
    display: inline-flex;
    color: var(--text-muted);
    font-size: 10px;
  }
  th.sorted-asc .sort-icon, th.sorted-desc .sort-icon {
    color: var(--accent);
  }

  table.crm-table tbody td {
    padding: 13px 14px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
    color: var(--text-primary);
  }
  table.crm-table tbody tr {
    transition: background 0.15s;
  }
  table.crm-table tbody tr:hover td {
    background: var(--bg-card-hover);
  }
  table.crm-table tbody tr:last-child td {
    border-bottom: none;
  }

  /* Badges & Pills */
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 700;

<script>
let workbookData = {};
let currentTab = "overview";
let activeKpiFilter = null; // 'all', 'opps', 'high', 'dormant'
let overviewSortCol = "latestResearch"; // default sort by latest research date
let overviewSortDir = "desc"; // latest first
let overviewColumnFilters = {}; // { colKey: filterValue }

function saveSessionPassword(pw){ sessionStorage.setItem("cdit_pw", pw); }
function getSessionPassword(){ return sessionStorage.getItem("cdit_pw") || ""; }
function clearSessionPassword(){ sessionStorage.removeItem("cdit_pw"); }

/* ---------------- Theme & Sidebar Controls ---------------- */
function applyTheme(){
  const mode = localStorage.getItem("cdit_theme") || "dark";
  const accent = localStorage.getItem("cdit_accent") || "indigo";
  document.documentElement.setAttribute("data-theme", mode);
  document.documentElement.setAttribute("data-accent", accent);
  document.querySelectorAll(".mode-toggle button").forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
  document.querySelectorAll(".accent-dot").forEach(d => d.classList.toggle("active", d.dataset.accent === accent));
}

function initThemeControls(){
  document.querySelectorAll(".mode-toggle button").forEach(b => {
    b.addEventListener("click", () => { localStorage.setItem("cdit_theme", b.dataset.mode); applyTheme(); });
  });
  document.querySelectorAll(".accent-dot").forEach(d => {
    d.addEventListener("click", () => { localStorage.setItem("cdit_accent", d.dataset.accent); applyTheme(); });
  });
  document.getElementById("themeBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    document.getElementById("themeMenu").classList.toggle("open");
  });
  document.addEventListener("click", () => document.getElementById("themeMenu").classList.remove("open"));
  applyTheme();

  // Sidebar toggle
  const sidebar = document.getElementById("appSidebar");
  const isCollapsed = localStorage.getItem("sidebar_collapsed") === "true";
  if (isCollapsed) sidebar.classList.add("collapsed");

  document.getElementById("sidebarCollapseBtn").addEventListener("click", () => {
    sidebar.classList.toggle("collapsed");
    localStorage.setItem("sidebar_collapsed", sidebar.classList.contains("collapsed"));
  });

  // Lock button
  document.getElementById("lockBtn").addEventListener("click", () => {
    clearSessionPassword();
    location.reload();
  });
}

async function unlock(){
  const pw = document.getElementById("pwInput").value;
  document.getElementById("pwError").textContent = "";
  const ok = await loadWorkbook(pw);
  if (ok) {
    saveSessionPassword(pw);
    revealChrome();
    renderTab(currentTab);
  } else {
    document.getElementById("pwError").textContent = "Incorrect password or sync failed.";
  }
}

function revealChrome(){
  document.getElementById("appSidebar").style.display = "flex";
  document.getElementById("refreshBtn").style.display = "inline-flex";
  document.getElementById("addBrandBtn").style.display = "inline-flex";
  document.getElementById("themeSwitcher").style.display = "block";
  document.getElementById("lockBtn").style.display = "inline-flex";
  updateSidebarBadges();
}

function updateSidebarBadges(){
  const brands = workbookData["Brands Master"] || [];
  const news = workbookData["News feed"] || [];
  const opps = workbookData["Opportunities"] || [];
  const contacts = workbookData["Contacts"] || [];
  const competitors = workbookData["Competitor Watch"] || [];
  const emails = workbookData["Email Drafts"] || [];

  document.getElementById("badgeOverview").textContent = brands.length;
  document.getElementById("badgeNews").textContent = news.length;
  document.getElementById("badgeOpps").textContent = opps.length;
  document.getElementById("badgeContacts").textContent = contacts.length;
  document.getElementById("badgeCompetitors").textContent = competitors.length;
  document.getElementById("badgeEmails").textContent = emails.length;
}

async function loadWorkbook(pw){
  const dot = document.getElementById("syncDot");
  const status = document.getElementById("syncStatus");
  dot.className = "status-dot loading";
  status.textContent = "Syncing Sheets...";
  try {
    const resp = await fetch("/api/sheet-data", {
      headers: { "x-dashboard-password": pw }
    });
    if (resp.status === 401) {
      dot.className = "status-dot locked";
      status.textContent = "Locked";
      return false;
    }
    if (!resp.ok) throw new Error("API error " + resp.status);
    const json = await resp.json();
    workbookData = json.sheets;
    dot.className = "status-dot";
    status.textContent = "Live · " + new Date(json.syncedAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    updateSidebarBadges();
    return true;
  } catch (e) {
    console.error(e);
    dot.className = "status-dot locked";
    status.textContent = "Sync failed";
    return false;
  }
}

async function submitAddBrand(){

  if (!brandName) { errEl.textContent = "Brand name is required."; return; }

/* ---------------- Pipeline stage update ---------------- */
async function updatePipelineStage(brandName, newStage, btnEl, noteEl){
  btnEl.disabled = true;
  const oldText = btnEl.textContent;
  btnEl.textContent = "Saving...";
  try {
    const today = new Date().toISOString().slice(0, 10);
    const resp = await fetch("/api/sheet-write", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-dashboard-password": getSessionPassword() },
      body: JSON.stringify({
        action: "updateRow",
        sheet: "Pipeline",
        matchColumn: "Brand",
        matchValue: brandName,
        updates: { "Stage": newStage, "Last Update": today }
      })
    });
    const data = await resp.json();
    if (!resp.ok || data.error) throw new Error(data.error || "Failed to update stage");
    noteEl.textContent = "Saved.";
    noteEl.style.display = "block";
    await refresh();
  } catch (e) {
    noteEl.textContent = "Failed: " + e.message;
    noteEl.style.display = "block";
    noteEl.style.color = "var(--high)";
  } finally {
    btnEl.disabled = false;
    btnEl.textContent = oldText;
  }
}

/* ---------------- Shared Helpers ---------------- */
function priorityLabel(score){
  score = Number(score) || 0;
  if (score >= 4) return "High";
  if (score === 3) return "Medium";
  return "Low";
}
function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function escapeAttr(s){ return escapeHtml(s).replace(/`/g, "&#96;"); }
function starRow(score, max = 5){
  score = Math.round(Number(score) || 0);
  let out = "";
  for (let i = 1; i <= max; i++) out += i <= score ? "&#9733;" : `<span class="empty-star">&#9733;</span>`;
  return `<span class="stars">${out}</span>`;
}
function brandLink(name, subtitle = ""){
  if (!name) return "-";
  return `
    <div class="brand-cell">
      <a class="brand-title-link" href="#" onclick="showBrandDetail('${escapeAttr(name).replace(/'/g,"&#39;")}');return false;">${escapeHtml(name)}</a>
      ${subtitle ? `<span class="brand-subtitle">${escapeHtml(subtitle)}</span>` : ""}
    </div>
  `;
}
function formatRelativeDate(dateStr){
  if (!dateStr) return "-";
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return dateStr;
  const now = new Date();
  const diffDays = Math.round((now - d) / (1000 * 60 * 60 * 24));
  if (diffDays === 0) return "Today";
  if (diffDays === 1) return "Yesterday";
  if (diffDays > 0 && diffDays < 30) return `${diffDays}d ago`;
  return d.toISOString().slice(0, 10);
}
function sortByDateDesc(rows, field){
  return rows.slice().sort((a, b) => String(b[field] || "").localeCompare(String(a[field] || "")));
}

/* ---------------- Overview Page with Interactive Filters & Sorting ---------------- */
function getBrandLatestResearchMap(){
  const news = workbookData["News feed"] || [];
  const pipeline = workbookData["Pipeline"] || [];
  const brands = workbookData["Brands Master"] || [];
  const map = {};

  // Initialize from Brands Master Date Added
  brands.forEach(b => {
    map[b["Brand"]] = { date: b["Date Added"] || "2000-01-01", snippet: "Brand record added" };
  });

  // Check Pipeline updates
  pipeline.forEach(p => {
    const b = p["Brand"];
    const d = p["Last Update"];
    if (d && (!map[b] || String(d).localeCompare(String(map[b].date)) > 0)) {
      map[b] = { date: d, snippet: `Pipeline: ${p["Stage"] || "Updated"}` };
    }
  });

  // Check News dates (the most active research signal)
  news.forEach(n => {
    const b = n["Brand"];
    const d = n["Date"];
    if (d && (!map[b] || String(d).localeCompare(String(map[b].date)) > 0)) {
      map[b] = { date: d, snippet: n["Headline"] || "News research updated" };
    }
  });

  return map;
}

  const trackedBrands = new Set((workbookData["Brands Master"] || []).map(b => b["Brand"]));

  const competitorNames = [...new Set(sorted.map(r => r["Competitor"]).filter(Boolean))].sort();
  const activeFilter = window.__competitorFilter || "All";
  const filterOptions = ["All", ...competitorNames];
  const pills = filterOptions.map(c => `
    <button class="filter-pill ${c === activeFilter ? "active" : ""}" onclick="setCompetitorFilter('${escapeAttr(c).replace(/'/g, "&#39;")}')">${escapeHtml(c)}</button>`).join("");
  const visible = activeFilter === "All" ? sorted : sorted.filter(r => r["Competitor"] === activeFilter);
  const list = visible.map((r, i) => {
    const competitorName = r["Competitor"] || "";
    const isTracked = competitorName && trackedBrands.has(competitorName);
    const trackBtn = competitorName ? `
      <div><button class="track-brand-btn" ${isTracked ? "disabled" : ""} onclick="event.stopPropagation(); addCompetitorAsTrackedBrand('${escapeAttr(competitorName).replace(/'/g, "&#39;")}', this)">${isTracked ? "Already tracked ✓" : "+ Track with AI Research"}</button></div>` : "";
    return `
    <div class="competitor-card" onclick="toggleCompetitorItem(${i})">
      <div class="meta"><span class="cat-tag">${escapeHtml(r["Category"] || r["Related Tracked Brand"] || "")}</span><span>${escapeHtml(r["Date"])}</span><span>· ${escapeHtml(r["Source"])}</span></div>
      <h4>${escapeHtml(r["Headline"])}</h4>
      <p>${escapeHtml(r["Summary"])}</p>
      <div id="competitor-expand-${i}" class="expand">
        <p><strong>Competitor:</strong> ${escapeHtml(r["Competitor"])} &nbsp;·&nbsp; <strong>Related to:</strong> ${escapeHtml(r["Related Tracked Brand"])}</p>
        <p>${escapeHtml(r["Full Analysis"] || r["Summary"])}</p>
        ${r["URL"] ? `<a href="${escapeAttr(r["URL"])}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:var(--accent);font-weight:600;">View source article &#8594;</a>` : ""}
      </div>
      <div class="expand-hint" id="competitor-hint-${i}">Click to expand analysis &#8595;</div>
      ${trackBtn}
    </div>`;
  }).join("");
  document.getElementById("content").innerHTML = `
    <div class="table-controls-bar">
      <div class="search-input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="searchBox" class="search-input" placeholder="Search competitor watch insights...">
      </div>
    </div>
    <div class="filter-pills">${pills}</div>
    <div class="competitor-grid">${list}</div>`;
  wireSearch();
}

async function addCompetitorAsTrackedBrand(brandName, btnEl){
  btnEl.disabled = true;

      method: "POST",

function wireSearch(){
  const box = document.getElementById("searchBox");

    document.querySelectorAll("#dataTable tbody tr, .news-item, .competitor-card").forEach(tr => {
      tr.style.display = !q || tr.textContent.toLowerCase().includes(q) ? "" : "none";

function copyToClipboard(text, btnEl){
  navigator.clipboard.writeText(text).then(() => {
    if (btnEl) {
      const old = btnEl.textContent;
      btnEl.textContent = "Copied ✓";
      setTimeout(() => { btnEl.textContent = old; }, 1500);
    }
  });
}
function copyEmailRich(subject, htmlBody, btnEl){
  const plain = subject + "\n\n" + htmlBody.replace(/<[^>]+>/g, "").replace(/\n{3,}/g, "\n\n");
  const richHtml = `<p><strong>Subject: ${subject}</strong></p>${htmlBody}`;
  try {
    const item = new ClipboardItem({
      "text/plain": new Blob([plain], { type: "text/plain" }),
      "text/html": new Blob([richHtml], { type: "text/html" }),
    });
    navigator.clipboard.write([item]).then(() => flashCopied(btnEl));
  } catch (e) {
    copyToClipboard(plain, btnEl);
  }
}
function flashCopied(btnEl){
  if (!btnEl) return;
  const old = btnEl.textContent;
  btnEl.textContent = "Copied — paste into Outlook/Gmail ✓";
  setTimeout(() => { btnEl.textContent = old; }, 2000);
}

async function generateAiEmailDraft(brandName, brand, topOpp, allNews, contact, btnEl){
  const statusEl = document.getElementById("aiDraftStatus");
  btnEl.disabled = true;
  statusEl.textContent = "Reading recent news + channelplay.in, drafting with Gemini...";
  try {
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - 60);
    const recentNews = (allNews || [])
      .filter(n => {
        const d = new Date(n["Date"]);
        return isNaN(d) ? true : d >= cutoff;
      })
      .slice(0, 8)
      .map(n => ({
        date: n["Date"], headline: n["Headline"],
        summary: n["AI Summary"] || n["Summary"] || "",
        source: n["Source"], category: n["Category"]
      }));

    const resp = await fetch("/api/generate-email", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-dashboard-password": getSessionPassword() },
      body: JSON.stringify({
        brand: brandName,
        sector: brand["Sector"] || "",
        segment: brand["Segment"] || "",
        topOpportunity: topOpp ? {
          type: topOpp["Opportunity Type"], businessImpact: topOpp["Business Impact"],
          opportunityForChannelplay: topOpp["Opportunity for Channelplay"],
          recommendedService: topOpp["Recommended Service"], nextAction: topOpp["Suggested Next Action"]
        } : null,
        recentNews,
        contactName: contact ? contact["Decision Maker Name"] : "",
        contactDesignation: contact ? contact["Designation"] : "",
      })
    });
    const data = await resp.json();
    if (!resp.ok || data.error) throw new Error(data.error || "Generation failed");

    window.__emailDraftState = { subject: data.subject, bodyHtml: data.bodyHtml };
    document.getElementById("emailResultWrap").style.display = "";
    document.getElementById("emailSubjectLine").textContent = data.subject;
    document.getElementById("emailBodyContent").innerHTML = data.bodyHtml;
    document.getElementById("emailDraftNote").textContent = "AI-generated just now via Gemini — grounded in this brand's recent news and live channelplay.in content.";
    statusEl.textContent = "Draft ready.";

    fetch("/api/sheet-write", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-dashboard-password": getSessionPassword() },
      body: JSON.stringify({
        action: "appendRows", sheet: "Email Drafts",
        rows: [{ "Brand": brandName, "Subject": data.subject, "Draft Body": data.plainBody || "" }]
      })
    }).catch(() => {});
  } catch (e) {
    statusEl.textContent = "Failed: " + e.message;
  } finally {
    btnEl.disabled = false;
  }
}

function buildExecSummary(brand, topOpp, news, pipelineRow){
  if (!topOpp) {
    return `${escapeHtml(brand["Brand"])} is being tracked but has not yet been through a full research and scoring pass. ${brand["Status Notes"] ? escapeHtml(brand["Status Notes"]) : "Check back after the next research cycle for an executive summary, scored opportunities, and a drafted outreach email."}`;
  }
  const latestDate = news[0] ? escapeHtml(news[0]["Date"]) : "an unspecified recent date";
  return `${escapeHtml(brand["Brand"])} is currently rated <strong>${escapeHtml(brand["Priority Tier"] || priorityLabel(topOpp["Priority Score (1-5)"]))} priority</strong>,
    with an opportunity score of ${escapeHtml(topOpp["Priority Score (1-5)"])}/5 and a confidence level of ${escapeHtml(topOpp["Confidence Score (1-5)"])}/5.
    Across ${news.length} tracked news item${news.length === 1 ? "" : "s"} (most recently ${latestDate}), the dominant signal is
    <strong>${escapeHtml(topOpp["Opportunity Type"])}</strong>: ${escapeHtml(topOpp["Business Impact"])}
    ${escapeHtml(topOpp["Opportunity for Channelplay"])}
    ${pipelineRow ? ` This account is currently at the <strong>${escapeHtml(pipelineRow["Stage"])}</strong> stage in the pipeline.` : ""}
    Recommended next step: ${escapeHtml(topOpp["Suggested Next Action"])}`;
}

function buildEmailDraft(brand, topOpp, news, sheetDraft){
  if (sheetDraft) {
    return {
      subject: sheetDraft["Subject"],
      bodyHtml: String(sheetDraft["Draft Body"] || "").split(/\n{2,}/).map(p => `<p>${escapeHtml(p)}</p>`).join(""),
      isTemplate: false
    };
  }
  if (!topOpp) {
    return { subject: `${brand["Brand"]} — Channelplay introduction`, bodyHtml: `<p>No opportunity data yet — a drafted email will appear here once this brand has been through a research pass.</p>`, isTemplate: true };
  }
  const latestNews = news[0];
  const subject = `Supporting ${brand["Brand"]}'s ${String(topOpp["Opportunity Type"]).toLowerCase()} with Channelplay`;
  const bodyHtml = `
    <p>Hi [Name],</p>
    <p>I noticed <strong>${escapeHtml(brand["Brand"])}</strong>'s recent move${latestNews ? ` — <em>${escapeHtml(latestNews["Headline"])}</em> (${escapeHtml(latestNews["Date"])}, ${escapeHtml(latestNews["Source"])})` : ""}.
    ${escapeHtml(topOpp["Business Impact"])}</p>
    <p>At Channelplay, we support brands through moments like this with <strong>${escapeHtml(topOpp["Recommended Service"])}</strong>.
    ${escapeHtml(topOpp["Opportunity for Channelplay"])}</p>
    <p>Would you be open to a short call to explore ${escapeHtml(String(topOpp["Suggested Next Action"]).replace(/\.$/,""))}?</p>
    <p>Best regards,<br>Bikash Roy<br>Group Program Manager, Channelplay</p>
  `;
  return { subject, bodyHtml, isTemplate: true };
}

function renderContactCard(contact){
  if (!contact || (!contact["Decision Maker Name"] && !contact["Official Email (public only)"])) {
    return `<div class="empty" style="padding:10px 0;">Contact research pending${contact && contact["Research Status"] ? " — " + escapeHtml(contact["Research Status"]) : ""}.</div>`;
  }
  const rows = [
    ["Name", contact["Decision Maker Name"]],
    ["Designation", contact["Designation"]],
    ["Department", contact["Department"]],
    ["Email", contact["Official Email (public only)"]],
    ["Phone", contact["Official Contact Number (public only)"]],
    ["Location", contact["Office Location"]],
  ].filter(([, v]) => v);
  let html = rows.map(([label, val]) => `
    <div class="cf">
      <div><div class="cf-label">${label}</div><div class="cf-value">${escapeHtml(val)}</div></div>
      <button class="copy-btn" data-copy="${escapeAttr(val)}">Copy</button>
    </div>`).join("");
  if (contact["LinkedIn Profile"] && !/not yet|not researched|search /i.test(contact["LinkedIn Profile"])) {
    html += `<div class="cf"><div><div class="cf-label">LinkedIn</div><div class="cf-value"><a href="${escapeAttr(contact["LinkedIn Profile"])}" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600;">Profile &#8594;</a></div></div></div>`;
  }
  return html || `<div class="empty" style="padding:10px 0;">Contact research pending.</div>`;
}
